apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pastebin
  namespace: pastebin
  annotations:                                               
    cert-manager.io/cluster-issuer: letsencrypt-production      
spec:
  tls:                                                     
    - hosts:                                               
        - pastes.online                                    
        - files.pastes.online                              
      secretName: pastebin-tls                             
  rules:
    - host: pastes.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: files.pastes.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3900