apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: pastebin
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      volumes:
        - name: config
          configMap:
            name: garage-config
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          env:
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pastebin-secrets
                  key: S3_ACCESS_KEY
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pastebin-secrets
                  key: S3_SECRET_KEY
            - name: GARAGE_DEFAULT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: pastebin-config
                  key: S3_BUCKET
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: pastebin-secrets
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pastebin-secrets
                  key: GARAGE_ADMIN_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3903
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi