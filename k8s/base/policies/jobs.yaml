apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cleanup
  namespace: pastebin
spec:
  podSelector:
    matchLabels:
      app: cleanup
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: garage
      ports:
        - port: 3900
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: pastebin
spec:
  podSelector:
    matchLabels:
      app: migrate
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432