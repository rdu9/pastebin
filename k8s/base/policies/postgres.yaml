apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: pastebin
spec:
  podSelector:
    matchLabels:
      app: postgres                     
  policyTypes:
    - Ingress                         
  ingress:
    - from:
        - podSelector:
            matchExpressions:          
              - key: app
                operator: In
                values: [api, worker, cleanup, migrate]
      ports:
        - port: 5432