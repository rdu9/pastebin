apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: pastebin
spec:
  podSelector:                          
    matchLabels:
      app: api
  policyTypes:
    - Ingress
    - Egress
  
  ingress:                             
    - from:
        - namespaceSelector:            
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:                
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8000                   
  
  egress:                              
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: garage
      ports:
        - port: 3900