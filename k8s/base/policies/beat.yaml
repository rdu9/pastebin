apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beat
  namespace: pastebin
spec:
  podSelector:
    matchLabels:
      app: beat
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379