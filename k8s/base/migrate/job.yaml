apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: pastebin
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: pastebin:15287c4
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: pastebin-config
            - secretRef:
                name: pastebin-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
