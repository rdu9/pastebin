apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pastebin
  namespace: pastebin
spec:
  ingressClassName: traefik              
  rules:
    - host: paste.localhost                
      http:
        paths:
          - path: /                     
            pathType: Prefix              
            backend:
              service:
                name: api
                port:
                  number: 80              
    - host: files.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3900